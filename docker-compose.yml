services:
  core:
    build: ./core
    container_name: technoreboot-core
    ports:
      - "8000:8000"
    volumes:
      - ./data/db:/data/db
      - ./data/storage:/data/storage
      - ./data/backups:/data/backups
    environment:
      - APP_ENV=dev
      - DATABASE_URL=sqlite:////data/db/technoreboot.db
      - STORAGE_ROOT=/data/storage
      - BACKUP_ROOT=/data/backups
      - API_TOKEN=dev-token
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  admin-shell:
    build: ./admin-shell
    container_name: technoreboot-admin-shell
    ports:
      - "8011:8010"
    environment:
      - CORE_API_URL=http://core:8000
      - CORE_API_TOKEN=dev-token
      - AVITO_MODULE_URL=http://avito-module:8020
      - AVITO_NOVNC_URL=http://avito-module:6080
    depends_on:
      - core
      - avito-module


  avito-module:
    build:
      context: ./avito-module
    container_name: technoreboot-avito-module
    environment:
      AVITO_MODULE_NAME: technoreboot-avito-module
      AVITO_MODULE_MODE: parser_mvp
      CORE_API_BASE_URL: http://core:8000
      AVITO_STORAGE_DIR: /app/data
      AVITO_REQUEST_DELAY_SECONDS: 3
      AVITO_MAX_PAGES_PER_RUN: 2
      DISPLAY: ":99"
    ports:
      - "8020:8020"
      - "127.0.0.1:8061:6080"
    volumes:
      - ./data/avito-module:/app/data
      - ./avito-module/app:/app/app
      - ./avito-module/tests:/app/tests
    depends_on:
      - core

  inventory-sales-module:
    build:
      context: ./inventory-sales-module
    container_name: technoreboot-inventory-sales-module
    environment:
      INVENTORY_SALES_MODULE_NAME: technoreboot-inventory-sales-module
      CORE_API_BASE_URL: http://core:8000
      PYTHONPATH: /app
    ports:
      - "8030:8030"
    volumes:
      - ./inventory-sales-module/app:/app/app
      - ./inventory-sales-module/tests:/app/tests
    depends_on:
      - core

  repairs-module:
    build:
      context: ./repairs-module
    container_name: technoreboot-repairs-module
    environment:
      REPAIRS_MODULE_NAME: technoreboot-repairs-module
      CORE_API_BASE_URL: http://core:8000
      PYTHONPATH: /app
    ports:
      - "8040:8040"
    volumes:
      - ./repairs-module/app:/app/app
      - ./repairs-module/tests:/app/tests
    depends_on:
      core:
        condition: service_healthy

